{{define "change-password"}}{{template "layout" .}}{{end}}
{{define "content_change_password"}}

<div class="login-header position-absolute top-0 start-0 p-4">
  <a href="/" class="text-decoration-none text-dark fw-bold fs-4">JGNSolutions</a>
</div>

<section class="login-split">
  <div class="login-left">
    <div class="login-inner">
      <h1 class="login-title">REESTABLECER CONTRASEÑA</h1>
      <p class="login-sub">Ingresa tu email y tu nueva contraseña.</p>

      <form id="changePasswordForm" class="login-form" novalidate>
        <label class="form-label mt-3">Email</label>
        <input id="email" type="email" class="form-control form-control-lg rounded-3" placeholder="Ingresa tu email" required>

        <label class="form-label mt-3">Nueva Contraseña</label>
        <input id="newPassword" type="password" class="form-control form-control-lg rounded-3" placeholder="**********" required minlength="8">

        <label class="form-label mt-3">Confirmar Nueva Contraseña</label>
        <input id="confirmPassword" type="password" class="form-control form-control-lg rounded-3" placeholder="**********" required minlength="8">

        <button class="btn btn-login w-100 btn-lg mt-4" type="submit">Cambiar Contraseña</button>

        <p class="text-center mt-3 small mb-0">
          Recordaste tu contraseña?
          <a href="/login" class="text-decoration-none fw-semibold">Inicia sesión aquí</a>
        </p>

        <div id="changePasswordError" class="alert alert-danger mt-3 d-none" role="alert"></div>
        <div id="changePasswordSuccess" class="alert alert-success mt-3 d-none" role="alert"></div>
      </form>
    </div>
  </div>

  <div class="login-right d-none d-md-block">
    <img src="/static/img/hero-login.png" alt="Change Password hero" class="hero-img">
  </div>
</section>

<footer class="login-footer text-center text-muted small py-3">
  © 2025 JGNSolutions — Todos los derechos reservados
</footer>

<script>
const form = document.getElementById('changePasswordForm');
const errDiv  = document.getElementById('changePasswordError');
const successDiv = document.getElementById('changePasswordSuccess');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errDiv.classList.add('d-none'); errDiv.textContent = "";
  successDiv.classList.add('d-none'); successDiv.textContent = "";

  const email = document.getElementById('email').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  // Validación básica en frontend
  if (!email || !newPassword || !confirmPassword) {
    errDiv.textContent = "Todos los campos son obligatorios.";
    errDiv.classList.remove('d-none');
    return;
  }
  if (newPassword !== confirmPassword) {
    errDiv.textContent = "Las contraseñas no coinciden.";
    errDiv.classList.remove('d-none');
    return;
  }
  if (newPassword.length < 8) {
    errDiv.textContent = "La nueva contraseña debe tener al menos 8 caracteres.";
    errDiv.classList.remove('d-none');
    return;
  }

console.log("Intentando cambiar contraseña para:", email);
  try {
    // Llamada fetch real al nuevo endpoint
    const response = await fetch("/api/auth/reset-password", { 
      method: "POST",
      headers: {"Content-Type": "application/json"},
      // Envía el email y la nueva contraseña (no la confirmación)
      body: JSON.stringify({ email: email, newPassword: newPassword })
    });

    // Manejo de errores de la API
    if (!response.ok) {
       let errorMsg = "Error al cambiar la contraseña.";
       try {
           const errorData = await response.json();
           errorMsg = errorData.error || errorMsg;
       } catch(e) { }
       throw new Error(errorMsg);
    }

    // Éxito
    successDiv.textContent = "Contraseña cambiada con éxito. Serás redirigido al login...";
    successDiv.classList.remove('d-none');
    setTimeout(() => { window.location.href = "/login"; }, 2000); // Redirige después de 2 seg

  } catch (error) {
    // Muestra el error de la API (o de red)
    errDiv.textContent = error.message || "Ocurrió un error inesperado.";
    errDiv.classList.remove('d-none');
  }
});
</script>

{{end}}
