{{define "register"}}{{template "layout" .}}{{end}}
{{define "content"}}

<div class="login-header position-absolute top-0 start-0 p-4">
  <a href="/" class="text-decoration-none text-dark fw-bold fs-4">JGNSolutions</a>
</div>

<section class="login-split">
  <!-- IZQUIERDA -->
  <div class="login-left">
    <div class="login-inner">
      <h1 class="login-title">CREATE ACCOUNT</h1>
      <p class="login-sub">Join us and start tracking your workouts.</p>

      <form id="registerForm" novalidate>
        <label class="form-label mt-3">Full Name</label>
        <input id="name" type="text" class="form-control form-control-lg rounded-3" placeholder="Enter your full name" required>

        <label class="form-label mt-3">Email</label>
        <input id="email" type="email" class="form-control form-control-lg rounded-3" placeholder="Enter your email" required>

        <label class="form-label mt-3">Password</label>
        <input id="password" type="password" class="form-control form-control-lg rounded-3" placeholder="**********" required>

        <button class="btn btn-login w-100 btn-lg mt-4" type="submit">Sign Up</button>

        <p class="text-center mt-3 small mb-0">
          Already have an account?
          <a href="/login" class="text-decoration-none fw-semibold">Sign in here</a>
        </p>

        <div id="registerError" class="alert alert-danger mt-3 d-none" role="alert"></div>
        <div id="registerSuccess" class="alert alert-success mt-3 d-none" role="alert"></div>
      </form>
    </div>
  </div>

  <!-- DERECHA -->
  <div class="login-right d-none d-md-block">
    <img src="/static/img/hero-login.png" alt="Register hero" class="hero-img">
  </div>
</section>

<footer class="login-footer text-center text-muted small py-3">
  © 2025 JGNSolutions — Todos los derechos reservados
</footer>

<script>
const form = document.getElementById('registerForm');
const err  = document.getElementById('registerError');
const ok   = document.getElementById('registerSuccess');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.add('d-none'); ok.classList.add('d-none');

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ name, email, password, role: "user" })
    });

    if (!res.ok) {
      let msg = "Registration failed";
      try { const j = await res.json(); msg = j.error || msg } catch {}
      throw new Error(msg);
    }

    ok.textContent = "User created successfully! Redirecting to login...";
    ok.classList.remove('d-none');

    setTimeout(() => window.location.href = "/login", 1800);

  } catch (e2) {
    err.textContent = e2.message || "Error during registration";
    err.classList.remove('d-none');
  }
});
</script>

{{end}}
